<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    *{
      padding: 0;
      margin: 0;
    }
    .parent{
      padding: 43px;
      margin: 34px;
      border: 3px solid purple;
    }
    .box{
      height: 200vh;
      width: 80vw;
      margin: 5px;
      padding: 5px;
      border: 1px solid black;
    }
    .box1{
      background-color: lightcoral;
      position: relative;
      z-index: 2;
      top: 10px;
      left: 10px;
    }
    .box2{
      position: relative;
      background-color: lightgoldenrodyellow;
      z-index: 10;
    }
    .box3{
      background-color: antiquewhite;
      /* position: sticky; */
      position: fixed;
      top: 10px;
      left: 8vw;
      height: 111px;
    }
  </style>
</head>
<body>
  <div class="parent">
    <div class="box box1">I'm box 1</div>
    <div class="box box2">I'm box 2</div>
    <div class="box box3">I'm box 3</div>
    <div class="box box4">I'm box 4</div>
  </div>
  
</body>
</html>
